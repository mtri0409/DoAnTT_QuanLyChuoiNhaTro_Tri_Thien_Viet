spring.application.name=qlchuoiphongtro
# 1. Địa chỉ kết nối (Thay 'db_quan_ly_tro' bằng tên Database của nhóm)
spring.datasource.url=jdbc:mysql://localhost:3306/db_quan_ly_tro?useSSL=false&serverTimezone=UTC

# 2. Thông tin đăng nhập XAMPP mặc định
spring.datasource.username=root
spring.datasource.password=

# 3. Cấu hình Hibernate (Tự động tạo bảng từ Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình secret key 

