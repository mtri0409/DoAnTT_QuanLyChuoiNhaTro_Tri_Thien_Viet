spring.application.name=qlchuoiphongtro
# 1. Địa chỉ kết nối (Local MySQL - không Docker)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/db_quan_ly_tro?useSSL=false&serverTimezone=UTC}

# 2. Thông tin đăng nhập XAMPP mặc định
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# 3. Cấu hình Hibernate (Tự động tạo bảng từ Entity)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Cấu hình secret key
jwt_secret=${JWT_SECRET:hethongquanlynhatroTri338Thien354Viet337}

# Cấu hình AI OCR URL (Local - không Docker)
app.ai-ocr-url=${AI_OCR_URL:http://localhost:8000/api}

# Cấu hình AI Chat Service URL (FastAPI)
app.ai-service-url=${AI_SERVICE_URL:http://localhost:8000}

# Base URL của Java Backend cho AI Service callback
app.java-backend-url=${JAVA_BACKEND_URL:http://localhost:8080}

#Swagger OpenAPI
#For sorting endpoints alphabetically
springdoc.swagger-ui.operationsSorter=alpha
#For sorting tags alphabetically
springdoc.swagger-ui.tagsSorter=alpha
#to remove doc expansion
springdoc.swagger-ui.doc-expansion=false

#image
